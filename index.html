<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Generator</title>
<style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#181818;background:#f7f7f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:#f7f7f5}.card{width:min(100%,560px);background:#fff;border:1px solid #e8e8e5;border-radius:18px;padding:clamp(24px,6vw,44px);box-shadow:0 8px 35px rgba(20,20,20,.035)}h1{font-size:clamp(27px,5vw,34px);font-weight:650;letter-spacing:-1.25px;line-height:1.2;margin:0 0 10px}h1:before{content:"";display:inline-block;vertical-align:-3px;width:24px;height:24px;margin-right:13px;border:5px solid #222;border-radius:5px;box-shadow:inset 0 0 0 3px white;background:#222}p{color:#747474;line-height:1.55;margin:0;font-size:15px}label{display:block;font-size:13px;font-weight:650;color:#3d3d3d;margin:34px 0 10px}textarea{width:100%;min-height:120px;resize:vertical;border:1px solid #dfdfdc;border-radius:10px;padding:15px 16px;background:#fff;color:#1b1b1b;font:inherit;font-size:15px;line-height:1.5;transition:border-color .2s,box-shadow .2s}textarea::placeholder{color:#a3a3a3}textarea:focus{outline:none;border-color:#777;box-shadow:0 0 0 3px #0000000a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:1px solid #1d1d1d;border-radius:9px;padding:13px 19px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:#1d1d1d;color:#fff;transition:background .15s,transform .15s}button:hover:not(:disabled){background:#414141;transform:translateY(-1px)}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#fff;color:#222;border-color:#dededb}.secondary:hover:not(:disabled){background:#f4f4f2}#result{margin-top:27px;text-align:center;background:#fafaf9;border:1px solid #ededeb;border-radius:12px;padding:25px 12px}#qr{display:inline-block;padding:12px;background:#fff;border-radius:7px;border:1px solid #ededeb}#qr canvas,#qr img{display:block;max-width:100%}#status{font-size:13px;min-height:22px;margin-top:14px;color:#555}footer{font-size:12px;color:#999;margin-top:30px;text-align:center;border-top:1px solid #eee;padding-top:20px}@media(max-width:420px){.actions button{width:100%}}
</style><link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="QR Code Generator"></head>
<body><main class="card"><h1>QR Code Generator</h1><p>Turn a website link or any text into a downloadable QR code.</p><label for="content">Website URL or text</label><textarea id="content" placeholder="https://example.com" maxlength="2000"></textarea><div class="actions"><button id="generate">Generate QR Code</button><button id="download" class="secondary" disabled>Download PNG</button></div><div id="result" hidden><div id="qr"></div></div><p id="status" role="status" aria-live="polite"></p><footer>No accounts or database. Your input isn't stored by this app.</footer></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const input=document.getElementById('content'),qr=document.getElementById('qr'),result=document.getElementById('result'),status=document.getElementById('status'),download=document.getElementById('download');
document.getElementById('generate').addEventListener('click',()=>{const value=input.value.trim();qr.innerHTML='';download.disabled=true;result.hidden=true;if(!value){status.textContent='Enter a website address or text first.';return}if(typeof QRCode==='undefined'){status.textContent='QR library failed to load. Check your internet connection and refresh.';return}try{new QRCode(qr,{text:value,width:256,height:256,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});result.hidden=false;download.disabled=false;status.textContent='QR code ready.'}catch(e){status.textContent='Unable to generate this QR code. Try shorter text.'}});
download.addEventListener('click',()=>{const canvas=qr.querySelector('canvas'),img=qr.querySelector('img');let url=canvas?.toDataURL('image/png')||img?.src;if(!url){status.textContent='Generate a QR code first.';return}const a=document.createElement('a');a.href=url;a.download='qr-code.png';document.body.appendChild(a);a.click();a.remove()});
</script></body></html>
