<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Generator</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172235;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,520px);background:white;border-radius:20px;padding:32px;box-shadow:0 14px 50px #1b31531c}h1{margin:0 0 8px;font-size:29px}p{color:#566579;line-height:1.5}label{display:block;font-weight:650;margin:26px 0 8px}textarea{width:100%;min-height:110px;resize:vertical;border:1px solid #cbd5e1;border-radius:10px;padding:12px;font:inherit}textarea:focus{outline:3px solid #cde2ff;border-color:#3678c9}button{border:0;border-radius:10px;padding:13px 18px;font:inherit;font-weight:650;cursor:pointer;background:#175cd3;color:white}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.secondary{background:#e9f0ff;color:#174c9e}#result{margin-top:26px;text-align:center}#qr{display:inline-block;padding:16px;background:#fff;border:1px solid #e2e8f0;border-radius:12px}#qr canvas,#qr img{display:block;max-width:100%}#status{font-size:14px;min-height:22px}footer{font-size:12px;color:#748196;margin-top:24px;text-align:center}</style></head>
<body><main class="card"><h1>QR Code Generator</h1><p>Turn a website link or any text into a downloadable QR code.</p><label for="content">Website URL or text</label><textarea id="content" placeholder="https://example.com" maxlength="2000"></textarea><div class="actions"><button id="generate">Generate QR Code</button><button id="download" class="secondary" disabled>Download PNG</button></div><div id="result" hidden><div id="qr"></div></div><p id="status" role="status" aria-live="polite"></p><footer>No accounts or database. Your input isn't stored by this app.</footer></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const input=document.getElementById('content'),qr=document.getElementById('qr'),result=document.getElementById('result'),status=document.getElementById('status'),download=document.getElementById('download');
document.getElementById('generate').addEventListener('click',()=>{const value=input.value.trim();qr.innerHTML='';download.disabled=true;result.hidden=true;if(!value){status.textContent='Enter a website address or text first.';return}if(typeof QRCode==='undefined'){status.textContent='QR library failed to load. Check your internet connection and refresh.';return}try{new QRCode(qr,{text:value,width:256,height:256,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});result.hidden=false;download.disabled=false;status.textContent='QR code ready.'}catch(e){status.textContent='Unable to generate this QR code. Try shorter text.'}});
download.addEventListener('click',()=>{const canvas=qr.querySelector('canvas'),img=qr.querySelector('img');let url=canvas?.toDataURL('image/png')||img?.src;if(!url){status.textContent='Generate a QR code first.';return}const a=document.createElement('a');a.href=url;a.download='qr-code.png';document.body.appendChild(a);a.click();a.remove()});
</script></body></html>
