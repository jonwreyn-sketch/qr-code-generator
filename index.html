<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Generator</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#eef3ff;background:#090e1b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 18px;background:radial-gradient(ellipse at 15% 10%,#243b75 0,transparent 42%),radial-gradient(ellipse at 90% 85%,#23315a 0,transparent 40%),#090e1b}.card{width:min(100%,560px);background:linear-gradient(145deg,#19243a,#111b2d);border:1px solid #34435d;border-radius:26px;padding:clamp(24px,6vw,42px);box-shadow:0 30px 90px #0007}h1{margin:0 0 10px;font-size:clamp(29px,5vw,39px);letter-spacing:-1.3px;line-height:1.12}h1:before{content:"▦";display:inline-grid;place-items:center;font-size:27px;vertical-align:4px;margin-right:12px;width:45px;height:45px;background:#a6f4db;color:#10243c;border-radius:12px}p{color:#aabbd4;line-height:1.6;margin:0}label{display:block;font-weight:650;margin:30px 0 10px;color:#e6efff}textarea{width:100%;min-height:120px;resize:vertical;border:1px solid #41526f;background:#0c1526;color:white;border-radius:14px;padding:16px;font:inherit;line-height:1.5}textarea::placeholder{color:#7184a2}textarea:focus{outline:3px solid #5ce5b455;border-color:#5ce5b4}button{border:0;border-radius:12px;padding:14px 19px;font:inherit;font-weight:700;cursor:pointer;background:#a6f4db;color:#10243c;transition:transform .15s,filter .15s}button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.06)}button:disabled{opacity:.42;cursor:not-allowed}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:17px}.secondary{background:#293a56;color:#edf4ff;border:1px solid #465a79}#result{margin-top:30px;text-align:center;background:#0d1728;border:1px solid #34445e;border-radius:18px;padding:25px 12px}#qr{display:inline-block;padding:16px;background:#fff;border-radius:12px}#qr canvas,#qr img{display:block;max-width:100%}#status{font-size:14px;min-height:23px;margin-top:16px;color:#a6f4db}footer{font-size:12px;color:#8497b4;margin-top:30px;text-align:center;border-top:1px solid #33425b;padding-top:20px}@media(max-width:440px){.actions button{width:100%}}
</style></head>
<body><main class="card"><h1>QR Code Generator</h1><p>Turn a website link or any text into a downloadable QR code.</p><label for="content">Website URL or text</label><textarea id="content" placeholder="https://example.com" maxlength="2000"></textarea><div class="actions"><button id="generate">Generate QR Code</button><button id="download" class="secondary" disabled>Download PNG</button></div><div id="result" hidden><div id="qr"></div></div><p id="status" role="status" aria-live="polite"></p><footer>No accounts or database. Your input isn't stored by this app.</footer></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const input=document.getElementById('content'),qr=document.getElementById('qr'),result=document.getElementById('result'),status=document.getElementById('status'),download=document.getElementById('download');
document.getElementById('generate').addEventListener('click',()=>{const value=input.value.trim();qr.innerHTML='';download.disabled=true;result.hidden=true;if(!value){status.textContent='Enter a website address or text first.';return}if(typeof QRCode==='undefined'){status.textContent='QR library failed to load. Check your internet connection and refresh.';return}try{new QRCode(qr,{text:value,width:256,height:256,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});result.hidden=false;download.disabled=false;status.textContent='QR code ready.'}catch(e){status.textContent='Unable to generate this QR code. Try shorter text.'}});
download.addEventListener('click',()=>{const canvas=qr.querySelector('canvas'),img=qr.querySelector('img');let url=canvas?.toDataURL('image/png')||img?.src;if(!url){status.textContent='Generate a QR code first.';return}const a=document.createElement('a');a.href=url;a.download='qr-code.png';document.body.appendChild(a);a.click();a.remove()});
</script></body></html>
