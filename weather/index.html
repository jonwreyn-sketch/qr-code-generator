<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f5"><title>Weather — Simple Forecast</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#202321;background:#f7f7f5}*{box-sizing:border-box}body{margin:0;padding:28px 18px}.wrap{max-width:900px;margin:32px auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:32px}h1{font-size:26px;letter-spacing:-1px;margin:0}h2{font-size:16px;letter-spacing:-.3px;margin:0 0 18px}.search{display:flex;gap:8px;flex-wrap:wrap}input{min-width:220px;flex:1;border:1px solid #dededb;border-radius:10px;background:white;padding:13px 15px;font:inherit;font-size:15px}button{background:#242725;color:white;border:0;border-radius:10px;padding:12px 19px;font:inherit;font-weight:600;cursor:pointer}button:hover{background:#444}button:focus-visible,input:focus-visible{outline:3px solid #a9c9bd}button:disabled{opacity:.5;cursor:wait}.panel{background:#fff;border:1px solid #e9e9e6;border-radius:18px;padding:26px;margin-bottom:18px}.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.location{font-size:15px;color:#666}.temp{font-size:clamp(70px,13vw,110px);letter-spacing:-8px;font-weight:500;line-height:1.15;margin:14px 0 2px}.condition{font-size:18px}.symbol{font-size:76px;line-height:1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:30px;border-top:1px solid #eee;padding-top:22px}.stat span{display:block;font-size:12px;color:#777;margin-bottom:8px}.stat strong{font-size:17px;font-weight:600}.scroll{overflow-x:auto;padding-bottom:8px}.hours{display:flex;gap:8px;min-width:max-content}.hour{width:86px;text-align:center;background:#f7f7f5;border-radius:12px;padding:16px 10px}.hour .icon{font-size:28px;margin:12px 0}.hour strong{font-size:17px}.day{display:grid;grid-template-columns:1.3fr 40px 1.5fr 90px;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid #f0f0ee}.day:last-child{border-bottom:0}.muted{color:#777;font-size:13px}.error{color:#a33}.foot{font-size:12px;color:#8a8a88;margin:20px 0}#message{min-height:20px;margin:0 0 14px;color:#666}@media(max-width:600px){.wrap{margin:4px auto}header{align-items:stretch}.search{width:100%}.search input{min-width:0}.panel{padding:20px}.stats{grid-template-columns:repeat(2,1fr);gap:20px}.day{grid-template-columns:75px 32px 1fr 66px;gap:8px}.temp{letter-spacing:-5px}}
</style></head>
<body><main class="wrap"><header><h1>Weather<span style="color:#aaa">.</span></h1><form class="search" id="search"><input id="city" aria-label="Search city" placeholder="Search a city" value="Toronto" required><button id="searchButton">Search</button></form></header><p id="message" role="status" aria-live="polite">Loading forecast…</p><div id="forecast" hidden><section class="panel"><div class="hero"><div><div class="location" id="location"></div><div class="temp" id="temperature"></div><div class="condition" id="condition"></div><p class="muted" id="updated"></p></div><div class="symbol" id="symbol" aria-hidden="true"></div></div><div class="stats"><div class="stat"><span>Feels like</span><strong id="feels"></strong></div><div class="stat"><span>Humidity</span><strong id="humidity"></strong></div><div class="stat"><span>Wind</span><strong id="wind"></strong></div><div class="stat"><span>Precipitation</span><strong id="precip"></strong></div></div></section><section class="panel"><h2>Next 24 hours</h2><div class="scroll"><div class="hours" id="hours"></div></div></section><section class="panel"><h2>7-day forecast</h2><div id="days"></div></section></div><p class="foot">Weather data: Open-Meteo · Temperatures in °C · Wind in km/h · Forecasts are estimates.</p></main>
<script>
const $=id=>document.getElementById(id);
const descriptions={0:['Clear sky','☀️'],1:['Mostly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Cloudy','☁️'],45:['Fog','🌫️'],48:['Fog','🌫️'],51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Heavy drizzle','🌧️'],56:['Freezing drizzle','🌧️'],57:['Freezing drizzle','🌧️'],61:['Light rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],66:['Freezing rain','🌧️'],67:['Freezing rain','🌧️'],71:['Light snow','🌨️'],73:['Snow','❄️'],75:['Heavy snow','❄️'],77:['Snow grains','🌨️'],80:['Rain showers','🌦️'],81:['Rain showers','🌧️'],82:['Heavy showers','🌧️'],85:['Snow showers','🌨️'],86:['Snow showers','❄️'],95:['Thunderstorm','⛈️'],96:['Thunderstorm','⛈️'],99:['Thunderstorm','⛈️']};
const weather=c=>descriptions[c]||['Variable conditions','🌥️'];
const round=n=>Math.round(n);
const hourLabel=s=>{const h=Number(s.slice(11,13));return (h%12||12)+(h>=12?' PM':' AM')};
const dayLabel=s=>new Date(s+'T12:00:00Z').toLocaleDateString('en-CA',{weekday:'short',timeZone:'UTC'});
function element(tag,cls,content){const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e}
async function load(query){$('searchButton').disabled=true;$('message').className='';$('message').textContent='Loading forecast…';try{
const geoRes=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(query)+'&count=1&language=en&format=json');if(!geoRes.ok)throw Error('Location search unavailable.');const geo=await geoRes.json();if(!geo.results?.length)throw Error('Location not found. Try a city and country.');const place=geo.results[0];
const params=new URLSearchParams({latitude:place.latitude,longitude:place.longitude,timezone:'auto',forecast_days:'7',current:'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m',hourly:'temperature_2m,precipitation_probability,weather_code',daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'});
const res=await fetch('https://api.open-meteo.com/v1/forecast?'+params);if(!res.ok)throw Error('Forecast service unavailable.');const data=await res.json();const c=data.current;const w=weather(c.weather_code);
$('location').textContent=[place.name,place.admin1,place.country].filter(Boolean).join(', ');$('temperature').textContent=round(c.temperature_2m)+'°';$('condition').textContent=w[0];$('symbol').textContent=w[1];$('feels').textContent=round(c.apparent_temperature)+'°C';$('humidity').textContent=round(c.relative_humidity_2m)+'%';$('wind').textContent=round(c.wind_speed_10m)+' km/h';$('precip').textContent=c.precipitation+' mm';$('updated').textContent='Current conditions';
const start=Math.max(0,data.hourly.time.findIndex(t=>t>=c.time.slice(0,13)+':00'));$('hours').replaceChildren();for(let i=start;i<Math.min(start+24,data.hourly.time.length);i++){const col=element('div','hour');col.append(element('div','muted',i===start?'Now':hourLabel(data.hourly.time[i])),element('div','icon',weather(data.hourly.weather_code[i])[1]),element('strong','',round(data.hourly.temperature_2m[i])+'°'),element('div','muted',data.hourly.precipitation_probability[i]+'% rain'));$('hours').append(col)}
$('days').replaceChildren();data.daily.time.forEach((date,i)=>{const row=element('div','day');row.append(element('strong','',i===0?'Today':dayLabel(date)),element('span','',weather(data.daily.weather_code[i])[1]),element('span','muted',weather(data.daily.weather_code[i])[0]+' · '+data.daily.precipitation_probability_max[i]+'%'),element('strong','',round(data.daily.temperature_2m_max[i])+'° / '+round(data.daily.temperature_2m_min[i])+'°'));$('days').append(row)});$('forecast').hidden=false;$('message').textContent='';
}catch(err){$('message').className='error';$('message').textContent=err.message||'Unable to load weather.'}finally{$('searchButton').disabled=false}}
$('search').addEventListener('submit',e=>{e.preventDefault();const q=$('city').value.trim();if(q)load(q)});load('Toronto');
</script></body></html>
